# SILVERWING ML - Reasoning Chain Training (M13)
# Trains a model to produce structured chain-of-thought responses:
#   Problem: {question}
#   Reasoning: 1. {step1} 2. {step2} ... N. {stepN}
#   Final Answer: {answer}
# Only the reasoning steps and final answer are supervised (problem prompt masked).
# Init from the DPO-aligned checkpoint (M12) or the SFT checkpoint (M11).
# Keep the tree clean (require_clean_repo); NO TRAINING WITHOUT A COMMIT.

reasoning:
  version: reasoning-v1
  model_config_path: configs/model.yaml
  tokenizer_dir: experiments/tokenizer
  init_from: experiments/checkpoints/sft/best.pt
  dataset_path: experiments/reasoning/reasoning-v1.jsonl
  checkpoint_dir: experiments/checkpoints/reasoning
  batch_size: 1
  block_size: 512
  max_steps: 200
  warmup_steps: 20
  lr: 1.0e-4
  min_lr_ratio: 0.1
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  grad_clip: 1.0
  seed: 42
  log_steps: 10
  eval_steps: 50
  eval_examples: 32
  save_steps: 100
  eval_fraction: 0.1
  require_clean_repo: true
  device: cpu
