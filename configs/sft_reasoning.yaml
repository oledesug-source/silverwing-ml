# SILVERWING ML - Reasoning SFT (CoT)
# Fine-tunes the continued pretrain checkpoint on reasoning-v1 data
# with chain-of-thought in responses. Init from cont/best.pt.

sft:
  version: reasoning-v1
  model_config_path: configs/model.yaml
  tokenizer_dir: experiments/tokenizer
  init_from: experiments/checkpoints/cont/best.pt
  dataset_path: experiments/reasoning/reasoning-v1-sft.jsonl
  checkpoint_dir: experiments/checkpoints/sft-reasoning
  batch_size: 1
  block_size: 512
  max_steps: 200
  warmup_steps: 20
  lr: 1.0e-4
  min_lr_ratio: 0.1
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  grad_clip: 1.0
  seed: 42
  log_steps: 10
  eval_steps: 50
  eval_examples: 32
  save_steps: 100
  eval_fraction: 0.1
  require_clean_repo: true
  device: cpu
