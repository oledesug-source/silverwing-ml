# SILVERWING ML - Small Model Config (~10M params)
# Designed for CPU training with expanded corpus.
# ~10M params, trains in minutes on CPU.

model:
  model_name: silverwing-decoder-small-v1
  vocab_size: 16384
  block_size: 512
  n_layer: 6
  n_head: 4
  n_kv_head: 4
  n_embd: 256
  mlp_hidden_size: 1024
  mlp_activation: swiglu
  dropout: 0.0
  norm_eps: 1e-5
  tie_embeddings: true
  bias: false
  init_std: 0.02
  rope_base: 10000.0
