# SILVERWING ML - SFT Run (M11)
# Fine-tunes the M10 pretrained checkpoint on the SFT dataset with
# response-masked cross-entropy. Keep the tree clean (require_clean_repo).

sft:
  version: sft-v1
  model_config_path: configs/model.yaml
  tokenizer_dir: experiments/tokenizer
  init_from: experiments/checkpoints/best.pt
  dataset_path: experiments/sft/sft-v1.jsonl
  checkpoint_dir: experiments/checkpoints/sft
  batch_size: 1
  block_size: 512
  max_steps: 200
  warmup_steps: 20
  lr: 1.0e-4
  min_lr_ratio: 0.1
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  grad_clip: 1.0
  seed: 42
  log_steps: 10
  eval_steps: 50
  eval_examples: 32
  save_steps: 100
  eval_fraction: 0.1
  require_clean_repo: true
  device: cpu
