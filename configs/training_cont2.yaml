# SILVERWING ML - Continued Pretraining Round 2
# Continue from pretrain-0002 (cont/best.pt) for another 2000 steps.
# Total: M10 (300) + pretrain-0002 (1000) + this (2000) = 3300 steps ≈ 5 epochs
# on corpus-v1 (340K train tokens). Goal: stronger base for better SFT accuracy.

training:
  version: training-v1
  model_config_path: configs/model.yaml
  corpus_dir: experiments/corpus
  tokenizer_dir: experiments/tokenizer
  tokenizer_version: tokenizer-v1
  checkpoint_dir: experiments/checkpoints/cont2
  resume_from: null
  init_from: experiments/checkpoints/cont/best.pt
  batch_size: 1
  grad_accum_steps: 1
  block_size: 512
  max_steps: 2000
  warmup_steps: 50
  lr: 5.0e-5
  min_lr_ratio: 0.1
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  grad_clip: 1.0
  seed: 42
  log_steps: 50
  eval_steps: 200
  eval_sequences: 8
  save_steps: 500
  max_tokens: null
  verify_dataset: true
  expected_dataset_hash: c049878033198f7197376e8de93ef94e41a3563e0a53ba4afe8db88efc936445
  require_validation: true
  require_clean_repo: true
  device: cpu
