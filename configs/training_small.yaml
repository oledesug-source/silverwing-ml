# SILVERWING ML - Small Model Pretrain (~10M params)
# Trains on expanded corpus, CPU-friendly.

training:
  version: training-small-v1
  model_config_path: configs/model_small.yaml
  corpus_dir: experiments/corpus
  tokenizer_dir: experiments/tokenizer
  tokenizer_version: null
  checkpoint_dir: experiments/checkpoints/small
  resume_from: experiments/checkpoints/small/best.pt
  batch_size: 8
  grad_accum_steps: 2
  block_size: 512
  max_steps: 3000
  warmup_steps: 50
  lr: 5.0e-4
  min_lr_ratio: 0.1
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  grad_clip: 1.0
  seed: 42
  log_steps: 50
  eval_steps: 200
  eval_sequences: 8
  save_steps: 500
  max_tokens: null
  verify_dataset: false
  expected_dataset_hash: null
  require_validation: false
  require_clean_repo: true
  device: cpu
