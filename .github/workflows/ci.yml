name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu || true

      - name: Run tests
        run: |
          python -m pytest tests/ --tb=short -q

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: ./**/*.xml
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff and dependencies
        run: |
          pip install ruff
          pip install -r requirements.txt -r requirements-dev.txt || true

      - name: Run ruff
        run: ruff check .

  lint-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for uncommitted tracked changes
        run: |
          git config --global user.email "ci@silverwing-ml.ai"
          git config --global user.name "CI"
          # Verify the working tree is clean (no uncommitted changes to tracked files)
          if [ -n "$(git status --porcelain)" ]; then
            echo "::warning::Working tree has uncommitted changes"
          fi
