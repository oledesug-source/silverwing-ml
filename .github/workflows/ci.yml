name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: pip install "ruff>=0.6.0"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    # Soft gate while the codebase migrates to full annotations;
    # flip to blocking once the remaining errors are resolved.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project + dev tools
        run: |
          pip install --upgrade pip
          pip install -e ".[core,dev]" types-PyYAML
      - name: Mypy
        run: mypy foundation intelligence serving sw_platform benchmarks silverwing_platform

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: |
          pip install --upgrade pip
          pip install -e ".[all,ml,serving]"
      - name: Run test suite (parallel, per-test timeout)
        run: pytest tests -n auto --timeout=300 -q --cov=. --cov-report=term-missing --cov-fail-under=0

  benchmark-smoke:
    name: Benchmark smoke gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: |
          pip install --upgrade pip
          pip install -e ".[all]"
      - name: Run dummy-model benchmark smoke
        run: python scripts/run_benchmark.py --benchmark math-benchmark-v1 --model dummy
