[project]
name = "silverwing"
version = "1.1.0"
description = "Silverwing — from-scratch, open, self-verified language model"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pyyaml>=6.0",
]

 [project.optional-dependencies]
    core = [
        "torch>=2.1",
    ]
    hf = [
        "datasets>=2.18",
    ]
    all = [
        "torch>=2.1",
        "datasets>=2.18",
        "pytest>=8.0",
    ]
    mlops = [
        "mlflow>=3.0",
        "wandb>=0.18",
        "kfp>=2.0",
    ]
    bigdata = [
        "pyspark>=3.5",
        "databricks-sdk>=0.20",
    ]
    tensorflow = [
        "tensorflow-cpu>=2.16",
    ]
    ml = [
        "scikit-learn>=1.4",
        "scipy>=1.13",
        "sympy>=1.12",
        "optuna>=3.6",
    ]
    dev = [
        "pytest>=8.0",
        "pytest-cov>=4.0",
        "ruff>=0.6.0",
        "mypy>=1.11.0",
        "pdoc3>=0.10.0",
        "pydantic-ai>=2.0",
        "fastapi>=0.139",
        "uvicorn>=0.52",
        "httpx>=0.27",
    ]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv",
    "__pycache__",
    "legacy",
    "experiments",
    ".git",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B905",  # zip-without-explicit-strict (too pervasive, behavior-changing)
    "E741",  # ambiguous-variable-name (common in ML/math code: l, I, O)
    "E402",  # module-import-not-at-top (scripts need sys.path manipulation)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "B011",  # assert-false is idiomatic in tests
    "E731",  # lambda-assignment tolerated in tests
]
"__init__.py" = [
    "F401",  # unused imports — re-export pattern
]

[tool.ruff.lint.isort]
known-first-party = ["foundation", "intelligence", "sw_platform", "serving", "runtime", "benchmarks", "platform"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
exclude = ["legacy/", "experiments/", ".venv/"]

[[tool.mypy.overrides]]
module = ["torch.*", "datasets.*", "yaml.*", "psutil.*", "transformers.*", "numpy.*"]
follow_imports = "skip"
ignore_missing_imports = true

