[project]
name = "silverwing"
version = "1.0.0"
description = "Silverwing — from-scratch, open, self-verified language model"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
core = [
    "torch>=2.1",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
