[project]
name = "silverwing"
version = "1.1.0"
description = "Silverwing — from-scratch, open, self-verified language model"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pyyaml>=6.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
    core = [
        "torch>=2.1",
    ]
    hf = [
        "datasets>=2.18",
    ]
    serving = [
        "pydantic-ai>=2.0",
        "fastapi>=0.139",
        "uvicorn>=0.52",
        "httpx>=0.27",
        "websockets>=12.0",
    ]
    all = [
        "torch>=2.1",
        "datasets>=2.18",
        "pytest>=8.0",
    ]
    mlops = [
        "mlflow>=3.0",
        "wandb>=0.18",
        "kfp>=2.0",
    ]
    bigdata = [
        "pyspark>=3.5",
        "databricks-sdk>=0.20",
    ]
    tensorflow = [
        "tensorflow-cpu>=2.16",
    ]
    gesture = [
        "opencv-python-headless>=4.8",
        "mediapipe>=0.10,<1.0",
        "pyautogui>=0.9.54",
        "ultralytics>=8.0",
        "python-socketio>=5.0",
        "paho-mqtt>=2.0",
        "psutil>=5.9",
    ]
    ml = [
        "scikit-learn>=1.4",
        "scipy>=1.13",
        "sympy>=1.12",
        "optuna>=3.6",
    ]
    dev = [
        "pytest>=8.0",
        "pytest-cov>=4.0",
        "pytest-xdist>=3.6",
        "pytest-timeout>=2.3",
        "ruff>=0.6.0",
        "mypy>=1.11.0",
        "pdoc3>=0.10.0",
    ]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
silverwing-train = "scripts.train:main"
silverwing-generate = "scripts.generate:main"
silverwing-benchmark = "scripts.run_benchmark:main"
silverwing-eval-gate = "scripts.eval_gate:main"
silverwing-preflight = "scripts.preflight_train:main"
silverwing-serve-platform = "scripts.serve_platform:main"
silverwing-validate-configs = "scripts.validate_configs:main"

[tool.setuptools.packages.find]
include = [
    "foundation*",
    "intelligence*",
    "serving*",
    "sw_platform*",
    "silverwing_platform*",
    "benchmarks*",
    "runtime*",
    "scripts*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
markers = [
    "slow: long-running tests (deselect with '-m \"not slow\"')",
    "gpu: tests requiring a CUDA device",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv",
    "__pycache__",
    "legacy",
    "experiments",
    ".git",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B905",  # zip-without-explicit-strict (too pervasive, behavior-changing)
    "E741",  # ambiguous-variable-name (common in ML/math code: l, I, O)
    "E402",  # module-import-not-at-top (scripts need sys.path manipulation)
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = [
    "B904",  # exception chaining noise inside notebook cells
]
"tests/*" = [
    "B011",  # assert-false is idiomatic in tests
    "E731",  # lambda-assignment tolerated in tests
]
"__init__.py" = [
    "F401",  # unused imports — re-export pattern
]

[tool.ruff.lint.isort]
known-first-party = ["foundation", "intelligence", "sw_platform", "serving", "runtime", "benchmarks", "platform"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
exclude = ["legacy/", "experiments/", ".venv/"]

[[tool.mypy.overrides]]
module = ["torch.*", "datasets.*", "yaml.*", "psutil.*", "transformers.*", "numpy.*", "cv2.*", "mediapipe.*", "pyautogui.*", "ultralytics.*", "socketio.*", "paho.*"]
follow_imports = "skip"
ignore_missing_imports = true

